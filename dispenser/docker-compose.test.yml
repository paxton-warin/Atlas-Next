services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas_dispenser_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports: ["55432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U test -d atlas_dispenser_test"],
        interval: 2s,
        timeout: 2s,
        retries: 30,
      }
  redis-test:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 2s,
        timeout: 2s,
        retries: 30,
      }
