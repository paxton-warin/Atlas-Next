# Candidate only. No database replacement or production activation is performed.
# Apply alongside docker-compose.yml only after independent acceptance.
services:
  app:
    environment:
      ATLAS_BACKUP_MAINTENANCE_EXTERNAL: 'true'
  backup-v2-worker:
    image: ${ATLAS_HUB_CANDIDATE_IMAGE:?Set the verified immutable candidate image}
    env_file:
      - ${ATLAS_HUB_ENV_FILE:?Set the existing private environment file}
    command: ['node', '--max-old-space-size=768', 'apps/server/dist/hubBackupsV2Worker.js']
    environment:
      NODE_ENV: production
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 32
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
