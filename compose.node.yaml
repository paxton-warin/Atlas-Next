services:
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    restart: unless-stopped
    environment:
      TRUST_PROXY: 172.30.81.3
    volumes:
      - node-data:/data
    networks:
      atlas-node:
        ipv4_address: 172.30.81.2
  edge:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.node:/etc/caddy/Caddyfile:ro
      - node-caddy-data:/data
      - node-caddy-config:/config
    networks:
      atlas-node:
        ipv4_address: 172.30.81.3
networks:
  atlas-node:
    ipam:
      config:
        - subnet: 172.30.81.0/24
volumes:
  node-data:
  node-caddy-data:
  node-caddy-config:
