<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas browsing runtime</title>
    <style>
      html,
      body,
      #frames {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }
      iframe[hidden] {
        display: none !important;
      }
      body.runtime-standalone {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr);
      }
      .runtime-standalone #frames {
        position: relative;
        min-height: 0;
      }
      #popup-toolbar {
        box-sizing: border-box;
        display: flex;
        min-width: 0;
        gap: 6px;
        align-items: center;
        padding: 5px 10px;
        border-bottom: 1px solid #2b382e;
        background: #111b14;
        color: #dfe7d9;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }
      .popup-brand {
        padding: 0 6px 0 2px;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      #popup-toolbar svg {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
      }
      #popup-toolbar button,
      #popup-return {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-sizing: border-box;
        min-width: 28px;
        height: 28px;
        padding: 5px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: #aebbad;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      #popup-toolbar button:hover:not(:disabled),
      #popup-return:hover {
        border-color: #344236;
        background: #202d23;
        color: #edf3e8;
      }
      #popup-toolbar button:focus-visible,
      #popup-return:focus-visible {
        outline: 2px solid #bce39b;
        outline-offset: 1px;
      }
      #popup-toolbar button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .popup-address-wrap {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 6px;
        min-width: 0;
        height: 30px;
        box-sizing: border-box;
        padding: 0 2px 0 8px;
        border: 1px solid #324235;
        border-radius: 7px;
        background: #18251c;
        color: #93a491;
      }
      .popup-address-wrap:focus-within {
        border-color: #87a878;
        box-shadow: 0 0 0 1px #87a878;
      }
      #popup-address {
        flex: 1;
        min-width: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: #dfe7d9;
        font: inherit;
        text-overflow: ellipsis;
      }
      #popup-address:disabled {
        opacity: 0.6;
      }
      #popup-toolbar #popup-go {
        width: 24px;
        min-width: 24px;
        height: 24px;
        padding: 3px;
      }
      #popup-return {
        padding-inline: 7px;
        white-space: nowrap;
      }
      #popup-status:empty {
        display: none;
      }
      #popup-status:not(:empty) {
        position: fixed;
        bottom: 12px;
        left: 50%;
        z-index: 10;
        width: max-content;
        max-width: calc(100vw - 24px);
        box-sizing: border-box;
        padding: 8px 12px;
        border: 1px solid #344236;
        border-radius: 8px;
        background: #18251c;
        color: #dfe7d9;
        box-shadow: 0 4px 16px #0003;
        font-size: 12px;
        overflow-wrap: anywhere;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .runtime-boot-error {
        max-width: 600px;
        margin: 15vh auto;
        padding: 24px;
        font: 16px/1.5 system-ui;
        color: #18251b;
      }
      @media (max-width: 600px) {
        #popup-toolbar {
          padding-inline: 6px;
          gap: 4px;
        }
        .popup-brand,
        .popup-return-label {
          display: none;
        }
        #popup-return {
          width: 28px;
          padding: 5px;
        }
      }
    </style>
  </head>
  <body>
    <div id="frames"></div>
    <script type="module" src="/host.ts"></script>
  </body>
</html>
